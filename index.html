<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro de Horas — Estações</title>
<style>
  :root{
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #22262d;
    --border: #2c3038;
    --text: #ece9e2;
    --muted: #8b8f98;
    --amber: #f0a537;
    --amber-dim: #6b4f1e;
    --teiji: #5fb88f;
    --zangyo: #e8734a;
    --danger: #d9524a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header{padding:16px 16px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10;}
  .clock{
    font-family: "SF Mono", "Courier New", monospace;
    font-variant-numeric: tabular-nums;
    font-size:40px; font-weight:700; letter-spacing:1px; color:var(--amber);
    line-height:1;
  }
  .header-row{display:flex; justify-content:space-between; align-items:flex-end;}
  .date-line{color:var(--muted); font-size:13px; margin-top:4px; text-transform:capitalize;}
  .reset-btn{background:none; border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:700;
    padding:8px 12px; border-radius:9px;}

  main{flex:1; padding:16px; padding-bottom:32px;}

  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:20px 0 10px;}
  .section-label:first-child{margin-top:0;}

  .stations-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .station-btn{
    aspect-ratio:1/0.85; border-radius:12px; border:2px solid var(--border);
    background:var(--panel); color:var(--text);
    font-size:17px; font-weight:800; letter-spacing:0.5px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.2; padding:4px;
    position:relative; transition: all .15s ease;
  }
  .station-btn small{position:absolute; bottom:8px; font-size:10px; font-weight:500; color:var(--muted);}
  .station-btn.active{background:linear-gradient(180deg,#3a2c14,#2a2010); border-color:var(--amber); color:var(--amber);
    box-shadow: 0 0 0 3px rgba(240,165,55,0.15) inset;}
  .station-btn.pending{background:linear-gradient(180deg,#3a1f1a,#2a1512); border-color:var(--zangyo); color:var(--zangyo);}
  .station-btn:disabled{opacity:0.45;}

  .status-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px;}
  .status-row{display:flex; justify-content:space-between; align-items:baseline;}
  .status-row .label{color:var(--muted); font-size:13px;}
  .status-row .value{font-family:monospace; font-variant-numeric: tabular-nums; font-size:22px; font-weight:700;}
  .status-sub{color:var(--muted); font-size:12px; margin-top:6px;}

  .events-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;}
  .event-row{display:flex; justify-content:space-between; align-items:center; background:var(--panel);
    border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:13.5px; flex-wrap:wrap; row-gap:6px;}
  .event-row .ev-station{font-weight:800; color:var(--amber); min-width:34px;}
  .event-row .ev-time{font-family:monospace; color:var(--text);}
  .event-row.ev-final{border-color:var(--teiji);}
  .event-row.ev-final .ev-station{color:var(--teiji);}
  .empty-msg{color:var(--muted); font-size:13px; text-align:center; padding:16px 0;}
  .mini-duration-input{
    width:30px; padding:4px 2px; font-size:12.5px; font-weight:700; text-align:center;
    background:var(--bg); border:1px solid var(--amber); color:var(--amber); border-radius:5px;
    font-family:monospace; -moz-appearance:textfield;
  }
  .mini-duration-input::-webkit-outer-spin-button, .mini-duration-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }

  table.totals{width:100%; border-collapse:collapse; margin-top:6px;}
  table.totals th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.totals td{padding:9px 8px; border-bottom:1px solid var(--border); font-size:14px;}
  table.totals td.station-cell{font-weight:800; color:var(--amber);}
  table.totals td.teiji-cell{color:var(--teiji); font-family:monospace;}
  table.totals td.zangyo-cell{color:var(--zangyo); font-family:monospace;}
  table.totals td.total-cell{font-family:monospace; font-weight:700;}
  table.totals tr.grand td{border-top:2px solid var(--border); border-bottom:none; font-weight:800; padding-top:12px;}
  table.totals tr.subtotal td{border-top:1px dashed var(--border); font-style:italic; color:var(--muted);}
  table.totals tr.subtotal td.station-cell{color:var(--muted);}

  .actions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:14px; font-weight:700;}
  .btn.finalize{background:linear-gradient(180deg,#4a2320,#3a1a18); border-color:var(--danger); color:#ff8f86;}
  .btn.finalize:disabled{opacity:0.4;}
  .btn.undo{color:var(--muted);}
  .btn.confirm{background:linear-gradient(180deg,#1e3327,#182a20); border-color:var(--teiji); color:var(--teiji);}

  .finalize-panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px;}
  .mode-toggle{display:flex; gap:10px; margin-bottom:12px;}
  .mode-btn{flex:1; padding:12px; border-radius:10px; border:2px solid var(--border); background:var(--panel-2); color:var(--muted); font-weight:700; font-size:14px;}
  .mode-btn.selected{border-color:var(--amber); color:var(--amber); background:var(--amber-dim);}
  .zangyo-input-row{display:none; align-items:center; gap:10px; margin-bottom:12px;}
  .zangyo-input-row.visible{display:flex;}
  .zangyo-input-row label{font-size:13px; color:var(--muted); flex:1;}
  .zangyo-input-row input{width:90px; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:16px; text-align:center;}

  .finalized-banner{background:linear-gradient(180deg,#1e3327,#182a20); border:1px solid var(--teiji); color:var(--teiji);
    border-radius:12px; padding:12px 14px; font-size:13px; margin-top:16px; text-align:center; font-weight:600;}

  .status-msg{margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13px; text-align:center; font-weight:600;
    background:rgba(95,184,143,0.12); color:var(--teiji); border:1px solid var(--teiji);}
  .status-msg.error{background:rgba(217,82,74,0.12); color:#ff8f86; border-color:var(--danger);}
  .backup-textarea{width:100%; min-height:200px; margin-top:8px; padding:10px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-family:monospace; font-size:10.5px; resize:vertical;}

  .tabs{display:flex; gap:8px; margin-top:14px;}
  .tab-btn{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); font-size:14px; font-weight:600;}
  .tab-btn.active{background:var(--amber-dim); color:var(--amber); border-color:var(--amber);}
  .history-item{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; font-size:14px; margin-bottom:8px;}
  .history-item .badge{font-size:10px; padding:3px 7px; border-radius:6px; font-weight:700;}
  .badge.done{background:rgba(95,184,143,0.15); color:var(--teiji);}
  .badge.open{background:rgba(240,165,55,0.15); color:var(--amber);}
  .back-link{color:var(--amber); font-size:13px; font-weight:600; margin-bottom:12px; display:inline-block;}
  .month-cards{display:flex; gap:10px; margin-bottom:18px;}
  .month-card{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .month-card .month-title{font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:8px;}
  .month-card .month-row{display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0;}
  .month-card .month-row .label{color:var(--muted);}
  .month-card .month-row.total .value{font-weight:800; color:var(--text);}
  .month-card .month-row.pay{border-top:1px dashed var(--border); margin-top:6px; padding-top:6px;}
  .month-card .month-row.pay .value{font-family:monospace; font-weight:700; color:var(--amber);}
  .month-card .teiji-value{color:var(--teiji); font-family:monospace;}
  .month-card .zangyo-value{color:var(--zangyo); font-family:monospace;}
  .pick-btn{
    aspect-ratio:1/0.85; border-radius:12px; border:2px solid var(--border);
    background:var(--panel); color:var(--text);
    font-size:15px; font-weight:800; text-align:center; line-height:1.2; padding:4px;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .pick-btn small{position:absolute; bottom:6px; font-size:9px; font-weight:500; color:var(--muted);}

  .btn.confirm:disabled{opacity:0.4;}
  .end-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .end-btn, .end-custom{
    min-height:68px; border-radius:12px; border:2px solid var(--border);
    background:var(--panel-2); color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .end-btn{font-family:"SF Mono","Courier New",monospace; font-variant-numeric:tabular-nums; font-size:26px; font-weight:700;}
  .end-custom{flex-direction:column; gap:2px; padding:6px 8px; font-size:11.5px; font-weight:600; color:var(--muted);}
  .end-custom input{width:100%; background:transparent; border:none; outline:none; color:var(--text); color-scheme:dark;
    font-family:"SF Mono","Courier New",monospace; font-size:22px; font-weight:700; text-align:center; padding:0;}
  .end-btn.selected, .end-custom.selected{border-color:var(--amber); background:var(--amber-dim); color:var(--amber);}
  .end-custom.selected input{color:var(--amber);}

  .rate-bar{margin-bottom:14px;}
  .rate-field{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:8px 10px 8px 14px;}
  .rate-field label{flex:1; font-size:13px; color:var(--muted);}
  .rate-field input{width:96px; padding:8px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:monospace; font-size:16px; text-align:right;}
  .rate-toggle{background:none; border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:700; padding:8px 12px; border-radius:9px;}
  .rate-show{display:block; margin-left:auto; padding:4px 14px; letter-spacing:2px;}
  .rate-field[hidden], .rate-show[hidden], .logout-overlay[hidden]{display:none !important;}

  .logout-overlay{position:fixed; top:0; left:0; right:0; bottom:0; z-index:1000; overflow-y:auto;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(180deg,#c0372f,#8f241e); text-align:center;}
  .logout-box{max-width:420px; width:100%;}
  .logout-icon{font-size:84px; line-height:1; animation:logout-pulse 1.1s ease-in-out infinite;}
  .logout-title{margin-top:18px; font-size:clamp(32px,10vw,46px); font-weight:900; line-height:1.12; color:#fff;}
  .logout-sub{margin-top:16px; font-size:17px; line-height:1.4; color:#ffe3df;}
  .logout-btn{margin-top:32px; width:100%; padding:20px; border-radius:14px; border:none; background:#fff; color:#8f241e; font-size:20px; font-weight:800;}
  @keyframes logout-pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.14);}}
  @media (prefers-reduced-motion: reduce){ .logout-icon{animation:none;} }

  .summary-overlay{position:fixed; top:0; left:0; right:0; bottom:0; z-index:900; overflow-y:auto;
    background:var(--bg); padding:24px 16px 32px;}
  .summary-box{max-width:480px; margin:0 auto;}
  .summary-title{font-size:22px; font-weight:800; color:var(--amber);}
  .summary-sub{margin:6px 0 10px; font-size:13px; line-height:1.4; color:var(--muted);}
  .summary-notes{margin-top:12px; font-size:12.5px; line-height:1.4; color:var(--muted);}
  .summary-notes .warn{color:#ff8f86; margin-top:6px;}
  table.totals td.changed{background:rgba(240,165,55,0.10);}
  .real-note{font-size:10.5px; color:var(--muted); font-family:monospace; margin-top:2px; white-space:nowrap;}
  .summary-overlay[hidden]{display:none !important;}

  .time-edit-row{display:flex; gap:10px; align-items:center; margin-bottom:6px;}
  .time-edit-row input{flex:1; min-width:0; padding:10px; border-radius:9px; border:1px solid var(--amber); background:var(--bg);
    color:var(--amber); color-scheme:dark; font-family:"SF Mono","Courier New",monospace; font-size:22px; font-weight:700; text-align:center;}
  .time-edit-row .btn{flex:1; padding:12px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="date-line" id="dateLine">—</div>
        <div class="date-line" id="versionTag" style="font-size:10px; opacity:0.6;">—</div>
      </div>
      <button class="reset-btn" id="resetBtn">Início do dia</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabToday">Hoje</button>
      <button class="tab-btn" id="tabHistory">Histórico</button>
    </div>
  </header>

  <main>
    <section id="view-history" hidden>
      <div class="rate-bar">
        <div class="rate-field" id="rateField">
          <label for="rateInput">Valor da hora</label>
          <input type="number" id="rateInput" inputmode="decimal" min="0" step="any" placeholder="0">
          <button type="button" class="rate-toggle" id="rateHideBtn">Esconder</button>
        </div>
        <button type="button" class="rate-toggle rate-show" id="rateShowBtn" aria-label="Mostrar campo" hidden>···</button>
      </div>
      <div id="monthSummary"></div>
      <div class="section-label">Dias registrados</div>
      <div id="historyList"></div>
    </section>

    <section id="view-today">
    <div class="section-label">Estação atual</div>
    <div class="stations-grid" id="stationsGrid"></div>

    <div class="status-card">
      <div class="status-row">
        <span class="label">Trabalhando em</span>
        <span class="value" id="currentStationVal">—</span>
      </div>
      <div class="status-sub" id="sinceVal">Selecione uma estação para começar</div>
    </div>

    <div class="finalize-panel" id="selectConfirmPanel" hidden>
      <div id="selectConfirmText" style="font-size:14.5px; margin-bottom:14px;"></div>
      <div class="actions" style="margin-top:0;">
        <button class="btn" id="cancelSelectBtn">Cancelar</button>
        <button class="btn confirm" id="confirmSelectBtn">Confirmar</button>
      </div>
    </div>

    <div id="finalizedBanner" class="finalized-banner" hidden></div>
    <div class="actions" id="continueServiceRow" hidden style="margin-top:10px;">
      <button class="btn confirm" id="continueServiceBtn">Continuar serviço</button>
    </div>

    <div class="section-label" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Registros de hoje</span>
      <button class="reset-btn" id="editStationBtn" style="text-transform:none; letter-spacing:0; padding:6px 10px; font-size:11.5px;">Editar registros</button>
    </div>
    <div class="events-list" id="eventsList"></div>
    <div class="finalize-panel" id="stationEditPanel" hidden></div>

    <div class="section-label" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span>Totais de hoje</span>
      <button class="reset-btn" id="editTimesBtn" style="text-transform:none; letter-spacing:0; padding:6px 10px; font-size:11.5px;">Ajustar horários</button>
    </div>
    <table class="totals">
      <thead><tr><th>Estação</th><th>Teiji</th><th>Zangyo</th><th>Total</th></tr></thead>
      <tbody id="totalsBody"></tbody>
    </table>
    <div id="adjustHint" style="font-size:12px; color:var(--muted); margin-top:8px;" hidden></div>
    <div class="actions" id="adjustActions" style="margin-top:10px;" hidden>
      <button class="btn" id="cancelAdjustBtn">Cancelar</button>
      <button class="btn confirm" id="saveAdjustBtn">Salvar ajustes</button>
    </div>

    <div class="actions">
      <button class="btn undo" id="undoBtn">Desfazer última</button>
      <button class="btn finalize" id="finalizeBtn">Finalizar serviço</button>
    </div>

    <div class="finalize-panel" id="finalizePanel" hidden>
      <div class="section-label" style="margin-top:0;">Que horas você terminou?</div>
      <div class="end-grid" id="endTimeGrid"></div>
      <div class="status-sub" id="endTimeSummary" style="margin:12px 0 14px;"></div>
      <div class="actions" style="margin-top:0;">
        <button class="btn" id="cancelFinalizeBtn">Cancelar</button>
        <button class="btn confirm" id="confirmFinalizeBtn" disabled>Confirmar finalização</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg" hidden></div>

    <div class="section-label">Diagnóstico</div>
    <div class="actions" style="margin-top:0;">
      <button class="btn" id="generateLogBtn">Gerar log</button>
    </div>
    <textarea class="backup-textarea" id="logTextArea" readonly hidden placeholder="Toque em 'Gerar log' para preencher aqui"></textarea>
    </section>
  </main>
</div>

<div id="logoutOverlay" class="logout-overlay" role="alertdialog" aria-modal="true" aria-labelledby="logoutTitle" hidden>
  <div class="logout-box">
    <div class="logout-icon">⚠️</div>
    <div class="logout-title" id="logoutTitle">FAÇA LOGOUT NO SISTEMA DA FÁBRICA</div>
    <div class="logout-sub" id="logoutSub"></div>
    <button type="button" class="logout-btn" id="logoutDoneBtn">Já fiz o logout</button>
  </div>
</div>

<div id="summaryOverlay" class="summary-overlay" role="dialog" aria-modal="true" aria-labelledby="summaryTitle" hidden>
  <div class="summary-box">
    <div class="summary-title" id="summaryTitle">Totais do dia</div>
    <div class="summary-sub" id="summarySub"></div>
    <div id="summaryTable"></div>
    <div class="summary-notes" id="summaryNotes"></div>
    <button type="button" class="btn confirm" id="summaryCloseBtn" style="width:100%; margin-top:22px;">Continuar</button>
  </div>
</div>

<script>
const APP_VERSION = 'v2026-11-03-01';
const STATIONS = ['1','2','3A','3B','4','M'];
const MAINT_STATION = 'M';              // メンテン
const MAINT_COMPENSATE_STATION = '3A';  // 修正: absorve todos os ajustes do メンテン
const STATION_LABELS = { '1':'静電', '2':'電着', '3A':'修正', '3B':'全検', '4':'そのほか', 'M':'メンテン' };
function labelFor(s){ return STATION_LABELS[s] || s; }
const BREAKS = [
  ['09:00','09:10'],
  ['11:20','12:00'],
  ['14:00','14:10'],
  ['15:30','15:40'],
];
const TEIJI_END = '15:30';
const ZANGYO_START = '15:40';
const DAY_START = '06:30';

// estimativa: o valor da hora vem do campo no Histórico (salvo só neste navegador); exibida sem símbolo de moeda, de propósito
const ZANGYO_MULTIPLIER = 1.25;
const RATE_KEY = 'settings:hourlyRate';
const RATE_HIDDEN_KEY = 'settings:rateHidden';

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKeyOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function timeOnDate(dayKey, hhmm){
  const [y,mo,da] = dayKey.split('-').map(Number);
  const [h,mi] = hhmm.split(':').map(Number);
  return new Date(y, mo-1, da, h, mi, 0, 0);
}
function fmtClock(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function fmtHM(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDur(ms){
  if(ms<0) ms=0;
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  const decimal = parseFloat((totalMin/60).toFixed(2)).toString();
  return h+':'+pad2(m)+'/'+decimal;
}
// valor estimado a partir dos minutos de teiji e zangyo (arredonda só no final)
function estimatePay(teijiMs, zangyoMs, rate){
  const teijiHours = Math.round(teijiMs/60000) / 60;
  const zangyoHours = Math.round(zangyoMs/60000) / 60;
  return Math.round(teijiHours * rate + zangyoHours * rate * ZANGYO_MULTIPLIER);
}
function fmtPay(value){
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); // separador de milhar no padrão brasileiro
}
function fmtElapsed(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return h+'h ' + pad2(m) + 'min';
  if(m>0) return m + 'min ' + pad2(s) + 's';
  return s + 's';
}
function fmtDateHuman(dayKey){
  const [y,mo,da] = dayKey.split('-').map(Number);
  const d = new Date(y, mo-1, da);
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  return pad2(da)+'/'+pad2(mo)+'/'+y+' · '+dias[d.getDay()];
}

function computeTotals(dayKey, events, endTime){
  const totals = {};
  STATIONS.forEach(s => totals[s] = {teiji:0, zangyo:0});
  const breakIntervals = BREAKS.map(([s,e]) => [timeOnDate(dayKey,s), timeOnDate(dayKey,e)]);
  const teijiEnd = timeOnDate(dayKey, TEIJI_END);

  for(let i=0;i<events.length;i++){
    const start = new Date(events[i].time);
    const end = i+1 < events.length ? new Date(events[i+1].time) : endTime;
    if(!(end > start)) continue;
    const station = events[i].station;
    if(!totals[station]) totals[station] = {teiji:0, zangyo:0};

    let segments = [[start, end]];
    for(const [bs,be] of breakIntervals){
      const next = [];
      for(const [s,e] of segments){
        if(be <= s || bs >= e){ next.push([s,e]); continue; }
        if(bs > s) next.push([s, new Date(Math.min(bs.getTime(), e.getTime()))]);
        if(be < e) next.push([new Date(Math.max(be.getTime(), s.getTime())), e]);
      }
      segments = next.filter(([s,e]) => e > s);
    }

    for(const [s,e] of segments){
      if(e <= teijiEnd){
        totals[station].teiji += (e - s);
      } else if(s >= teijiEnd){
        totals[station].zangyo += (e - s);
      } else {
        totals[station].teiji += (teijiEnd - s);
        totals[station].zangyo += (e - teijiEnd);
      }
    }
  }
  return totals;
}

// aplica os ajustes manuais (por estação, teiji/zangyo) por cima dos totais reais calculados a partir dos registros
function getTotalsFor(dd){
  let endTime;
  if(dd.finalized){
    endTime = new Date(dd.finalizedAt);
  } else if(dd.date === today){
    endTime = new Date(); // dia de hoje, ainda em andamento — usa o relógio atual
  } else {
    // dia antigo que nunca foi finalizado: não sabemos quando terminou de verdade,
    // então não conta o último serviço como se estivesse em andamento até agora
    endTime = dd.events.length ? new Date(dd.events[dd.events.length-1].time) : timeOnDate(dd.date, DAY_START);
  }
  const raw = computeTotals(dd.date, dd.events, endTime);
  const totals = {};
  STATIONS.forEach(s => { totals[s] = {teiji:0, zangyo:0}; });

  // Método do maior resto (Hamilton): arredondar cada estação separadamente pode fazer a SOMA
  // ficar 1 minuto a mais ou a menos do que o total real (várias frações de segundo arredondando
  // "pra cima" ao mesmo tempo). Este método garante que a soma das estações bate exatamente com
  // o total verdadeiro: arredonda todo mundo pra baixo primeiro, depois distribui os minutos que
  // faltam pras estações que tinham a maior fração sobrando.
  ['teiji','zangyo'].forEach(category => {
    const exactMin = STATIONS.map(s => {
      const adj = (dd.adjustments && dd.adjustments[s] && dd.adjustments[s][category]) || 0;
      return (raw[s][category] + adj) / 60000;
    });
    const floorMin = exactMin.map(m => Math.floor(m));
    const totalExact = exactMin.reduce((a,b) => a+b, 0);
    const targetTotal = Math.round(totalExact);
    let leftover = Math.max(0, targetTotal - floorMin.reduce((a,b) => a+b, 0));
    const order = STATIONS.map((s,i) => i).sort((a,b) => (exactMin[b]-floorMin[b]) - (exactMin[a]-floorMin[a]));
    const finalMin = floorMin.slice();
    for(let k = 0; k < leftover && k < order.length; k++){
      finalMin[order[k]] += 1;
    }
    STATIONS.forEach((s,i) => { totals[s][category] = finalMin[i] * 60000; });
  });

  return totals;
}
function getAdjustedTotals(){
  return getTotalsFor(dayData);
}

let pendingStation = null;

const LUNCH_START = '11:20';
const LUNCH_END = '12:00';

let pendingContinueTime = null;

function computeEventTime(){
  if(dayData.events.length === 0){
    return { time: timeOnDate(today, DAY_START), afterLunch:false };
  }
  if(pendingContinueTime){
    return { time: new Date(pendingContinueTime), afterLunch:false, continuing:true };
  }
  const last = dayData.events[dayData.events.length-1];
  const lastTime = new Date(last.time);
  const lunchStart = timeOnDate(today, LUNCH_START);
  if(lastTime < lunchStart && new Date() >= lunchStart){
    return { time: timeOnDate(today, LUNCH_END), afterLunch:true };
  }
  return { time: new Date(), afterLunch:false };
}

  logAction('Reabriu o serviço (estava finalizado às ' + fmtHM(new Date(oldFinalizedAt)) + ') pra continuar em outra estação');

function slotLabel(totalMin){
  const m = ((totalMin % 1440) + 1440) % 1440;
  return pad2(Math.floor(m/60)) + ':' + pad2(m%60);
}
function hhmmToMin(hhmm){
  const [h, m] = hhmm.split(':').map(Number);
  return h*60 + m;
}
// A saída do teiji é sempre 15:30; o zangyo recomeça a contar às 15:40 (intervalo de descanso),
// então as saídas com zangyo são 15:40 + múltiplos de 15 min (15:55, 16:10, 16:25...).
// Mostra 1 opção antes de agora e 2 depois (se agora cai exatamente num horário, ele é o 2º da lista).
function computeEndSlots(now){
  const mins = now.getHours()*60 + now.getMinutes();
  const slots = [hhmmToMin(TEIJI_END)];
  for(let t = hhmmToMin(ZANGYO_START) + 15; t < 1440; t += 15) slots.push(t);
  let idx = 0;
  for(let i = 0; i < slots.length; i++){ if(slots[i] < mins) idx = i; }
  idx = Math.min(idx, slots.length - 3);
  return slots.slice(idx, idx + 3).map(slotLabel);
}

// ---- Resumo ao finalizar: 電着 arredondado de 15 em 15 min (só para exibir; o histórico guarda o horário real) ----
const ROUND_STATION = '2';   // 電着
const ROUND_STEP_MIN = 15;
let logoutPending = false;

// Arredonda o tempo de 電着 (teiji e zangyo, cada um) para o múltiplo de 15 min mais próximo e compensa a diferença
// na próxima estação com horas naquela categoria (mesma regra do painel de ajuste). Não altera nada salvo.
function buildRoundedTotals(real){
  const adj = {};
  STATIONS.forEach(s => { adj[s] = { teiji: real[s].teiji, zangyo: real[s].zangyo }; });
  const skipped = [];
  const idx = STATIONS.indexOf(ROUND_STATION);
  ['teiji','zangyo'].forEach(cat => {
    const realMin = Math.round(real[ROUND_STATION][cat] / 60000);
    const target = Math.round(realMin / ROUND_STEP_MIN) * ROUND_STEP_MIN;
    const delta = target - realMin;
    if(delta === 0) return;
    let nextS = null;
    for(let j = idx + 1; j < STATIONS.length; j++){
      if(STATIONS[j] === MAINT_STATION) continue; // メンテン só se ajusta com o 修正
      if(real[STATIONS[j]][cat] !== 0){ nextS = STATIONS[j]; break; }
    }
    if(nextS){
      const nextMin = Math.round(real[nextS][cat] / 60000);
      if(nextMin - delta < 0){ skipped.push(cat); return; } // a próxima não tem tempo pra compensar
      adj[nextS][cat] = (nextMin - delta) * 60000;
    }
    adj[ROUND_STATION][cat] = target * 60000;
  });
  return { adj, skipped };
}

function summaryTableHTML(adj, real){
  const cell = (cls, a, r) => {
    const changed = a !== r;
    return '<td class="' + cls + (changed ? ' changed' : '') + '">' + fmtDur(a) +
      (changed ? '<div class="real-note">real ' + fmtDur(r) + '</div>' : '') + '</td>';
  };
  const row = (label, a, r, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="station-cell">' + label + '</td>' +
    cell('teiji-cell', a.teiji, r.teiji) + cell('zangyo-cell', a.zangyo, r.zangyo) +
    cell('total-cell', a.teiji + a.zangyo, r.teiji + r.zangyo) + '</tr>';
  const isZero = t => t.teiji === 0 && t.zangyo === 0;
  const sumOf = (t, list) => list.reduce((acc, s) => ({ teiji: acc.teiji + t[s].teiji, zangyo: acc.zangyo + t[s].zangyo }), { teiji:0, zangyo:0 });
  let rows = '';
  STATIONS.forEach(s => {
    if(isZero(adj[s]) && isZero(real[s])) return;
    rows += row(labelFor(s), adj[s], real[s]);
  });
  const a34 = sumOf(adj, ['3A','3B']), r34 = sumOf(real, ['3A','3B']);
  if(!(isZero(a34) && isZero(r34))) rows += row(labelFor('3A') + ' + ' + labelFor('3B'), a34, r34, 'subtotal');
  rows += row('Total', sumOf(adj, STATIONS), sumOf(real, STATIONS), 'grand');
  return '<table class="totals"><thead><tr><th>Estação</th><th>Teiji</th><th>Zangyo</th><th>Total</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function showFinalSummary(){
  const real = getTotalsFor(dayData);
  const { adj, skipped } = buildRoundedTotals(real);
  const changes = [];
  STATIONS.forEach(s => ['teiji','zangyo'].forEach(c => {
    if(adj[s][c] !== real[s][c]) changes.push(s + '.' + c + ': ' + Math.round(real[s][c]/60000) + 'm → ' + Math.round(adj[s][c]/60000) + 'm');
  }));
  logAction('Resumo ao finalizar: ' + (changes.join('; ') || 'sem ajuste') + (skipped.length ? ' (sem compensação possível: ' + skipped.join(', ') + ')' : ''));
  el.summarySub.textContent = labelFor(ROUND_STATION) + ' arredondado de ' + ROUND_STEP_MIN + ' em ' + ROUND_STEP_MIN +
    ' min. Onde o horário mudou, o real aparece embaixo; o histórico guarda o real.';
  el.summaryTable.innerHTML = summaryTableHTML(adj, real);
  let notes = '';
  if(changes.length === 0 && skipped.length === 0) notes += 'Nenhum ajuste foi necessário.';
  skipped.forEach(cat => {
    notes += '<div class="warn">' + (cat === 'teiji' ? 'Teiji' : 'Zangyo') + ' de ' + labelFor(ROUND_STATION) +
      ' ficou sem ajuste: a próxima estação não tem tempo suficiente para compensar.</div>';
  });
  el.summaryNotes.innerHTML = notes;
  el.summaryOverlay.hidden = false;
  el.summaryOverlay.scrollTop = 0;
}

    '<button type="button" class="btn confirm" id="saveEvTimeBtn">Salvar horário</button></div>' +
    '<div class="section-label">Trocar estação</div>';
  html += '<div class="stations-grid" style="margin-bottom:12px;">';
  STATIONS.forEach(s => {
    html += '<button class="pick-btn" data-pick="' + s + '" style="' + (s === ev.station ? 'opacity:0.4;' : '') + '">' + labelFor(s) + '<small>' + s + '</small></button>';
  });
  html += '</div><div class="actions" style="margin-top:0;"><button class="btn" id="cancelStationEditBtn">Cancelar</button></div>';
  el.stationEditPanel.innerHTML = html;
  document.getElementById('saveEvTimeBtn').addEventListener('click', () => {
    saveEventTime(idx, document.getElementById('evTimeInput').value);
  });
  el.stationEditPanel.querySelectorAll('[data-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const newStation = btn.dataset.pick;
      if(newStation !== ev.station){
        const oldStation = ev.station;
        dayData.events[idx].station = newStation;
        logAction('Trocou estação do registro das ' + fmtHM(new Date(ev.time)) + ': ' + labelFor(oldStation) + ' → ' + labelFor(newStation));
        saveDay();
        render();
        showStatus('Estação corrigida para ' + labelFor(newStation) + '.');
      }
      closeStationEditPanel();
    });
  });
  document.getElementById('cancelStationEditBtn').addEventListener('click', closeStationEditPanel);
}
// corrige a hora de entrada de um registro (ex.: esqueceu de trocar de estação a tempo)
function saveEventTime(idx, hhmm){
  const ev = dayData.events[idx];
  if(!ev) return;
  if(!/^\d{2}:\d{2}$/.test(hhmm || '')){
    showStatus('Digite um horário válido.', true);
    return;
  }
  const oldTime = new Date(ev.time);
  if(fmtHM(oldTime) === hhmm){ closeStationEditPanel(); return; } // nada mudou
  const newTime = timeOnDate(dayData.date, hhmm);
  const prev = dayData.events[idx-1], next = dayData.events[idx+1];
  if(prev && newTime <= new Date(prev.time)){
    showStatus('O horário precisa ser depois do registro anterior (' + fmtHM(new Date(prev.time)) + ').', true);
    return;
  }
  if(next && newTime >= new Date(next.time)){
    showStatus('O horário precisa ser antes do próximo registro (' + fmtHM(new Date(next.time)) + ').', true);
    return;
  }
  if(!next){
    if(dayData.finalized){
      if(newTime >= new Date(dayData.finalizedAt)){
        showStatus('O horário precisa ser antes do fim do serviço (' + fmtHM(new Date(dayData.finalizedAt)) + ').', true);
        return;
      }
    } else if(newTime > new Date()){
      showStatus('O horário não pode ser no futuro.', true);
      return;
    }
  }
  ev.time = newTime.toISOString();
  logAction('Corrigiu a entrada em ' + labelFor(ev.station) + ': ' + fmtHM(oldTime) + ' → ' + hhmm);
  saveDay();
  render();
  closeStationEditPanel();
  showStatus('Horário de entrada corrigido para ' + hhmm + '.');
}

function readCategoryInput(category, station){
  const hInput = el.totalsBody.querySelector('.'+category+'-h-input[data-station="'+station+'"]');
  const mInput = el.totalsBody.querySelector('.'+category+'-m-input[data-station="'+station+'"]');
  if(!hInput || !mInput) return null; // estação não exibida (sem horas hoje) — nada a ler
  const h = parseInt(hInput.value, 10), m = parseInt(mInput.value, 10);
  if(isNaN(h) || isNaN(m) || h < 0 || m < 0 || m > 59) return NaN; // exibida mas com valor inválido
  return h*3600000 + m*60000;
}

function saveAdjustPanel(){
  const draft = JSON.parse(JSON.stringify(dayData.adjustments || {})); // rascunho — só aplica em dayData se tudo validar
  let errorMsg = null;
  const grandBefore = { teiji:0, zangyo:0 };
  const expectedGrandChange = { teiji:0, zangyo:0 };
  const changeLines = [];

  ['teiji','zangyo'].forEach(category => {
    if(errorMsg) return;
    // valores congelados no momento em que o painel foi aberto — não usa o relógio atual,
    // senão um segundo passando entre abrir e salvar faria o sistema achar que algo mudou sozinho
    const origValues = STATIONS.map(s => {
      const hInput = el.totalsBody.querySelector('.'+category+'-h-input[data-station="'+s+'"]');
      return hInput ? Number(hInput.dataset.orig) : 0;
    });
    grandBefore[category] = origValues.reduce((a,v) => a+v, 0);

    for(let i = 0; i < STATIONS.length; i++){
      const s = STATIONS[i];
      const read = readCategoryInput(category, s);
      if(read === null) continue; // estação não exibida: nada pra editar aqui
      if(Number.isNaN(read)){ errorMsg = 'Preencha horas e minutos válidos em todos os campos.'; break; }
      if(read === origValues[i]) continue; // não mexido: não cascateia
      const delta = read - origValues[i];
      changeLines.push(s + '.' + category + ': ' + Math.round(origValues[i]/60000) + 'm → ' + Math.round(read/60000) + 'm (delta ' + Math.round(delta/60000) + 'm)');
      if(!draft[s]) draft[s] = {teiji:0, zangyo:0};
      draft[s][category] = (draft[s][category]||0) + delta;

      // acha a estação que compensa: o メンテン sempre desconta do 修正; as outras usam a próxima da lista
      // com horas nessa categoria (pulando as zeradas e sem nunca usar o メンテン)
      let targetIdx = -1;
      if(s === MAINT_STATION){
        targetIdx = STATIONS.indexOf(MAINT_COMPENSATE_STATION);
      } else {
        for(let j = i+1; j < STATIONS.length; j++){
          if(STATIONS[j] === MAINT_STATION) continue;
          if(origValues[j] !== 0){ targetIdx = j; break; }
        }
      }
      if(targetIdx !== -1){
        const next = STATIONS[targetIdx];
        if(!draft[next]) draft[next] = {teiji:0, zangyo:0};
        draft[next][category] = (draft[next][category]||0) - delta;
      } else {
        expectedGrandChange[category] += delta; // sem próxima estação: essa mudança afeta o total geral mesmo
      }
    }
  });

  if(errorMsg){ showStatus(errorMsg, true); return; }

  const draftTotals = getTotalsFor(Object.assign({}, dayData, { adjustments: draft }));
  const hasNegative = STATIONS.some(s => draftTotals[s].teiji < 0 || draftTotals[s].zangyo < 0);
  if(hasNegative){
    showStatus('Esse ajuste deixaria alguma estação com horas negativas. Tente valores menores.', true);
    return;
  }

  // verificação de segurança: o total geral só deveria mudar pelo valor esperado (edições sem próxima estação).
  // se mudar mais que isso, tem algo errado — melhor avisar na hora do que deixar passar batido.
  const warnings = [];
  ['teiji','zangyo'].forEach(category => {
    const grandAfter = STATIONS.reduce((a,s) => a+draftTotals[s][category], 0);
    const diff = (grandAfter - grandBefore[category]) - expectedGrandChange[category];
    if(Math.abs(diff) >= 60000){
      warnings.push(category + ': ' + Math.round(diff/60000) + 'min a mais/menos do que deveria');
    }
  });
  if(warnings.length > 0){
    logAction('TENTATIVA DE AJUSTE FALHOU. Mudanças pedidas: [' + changeLines.join('; ') + ']. Problema: ' + warnings.join('; ') + '.');
    showStatus('Atenção: o ajuste não bateu certinho (' + warnings.join('; ') + '). Nada foi salvo — toque em "Gerar log" logo abaixo e me manda o texto.', true);
    return;
  }

  logAction('Ajuste salvo com sucesso: [' + (changeLines.join('; ') || 'nenhuma mudança') + ']');
  dayData.adjustments = draft;
  closeAdjustPanel();
  saveDay();
  render();
  showStatus('Ajustado — a diferença foi compensada na próxima estação da lista.');
}

function updateElapsedDisplay(){
  if(dayData.finalized){
    el.sinceVal.textContent = 'Serviço encerrado';

  }
  const lastEvent = dayData.events[dayData.events.length-1];
  if(!lastEvent){
    el.sinceVal.textContent = 'Selecione uma estação para começar';
    return;
  }
  const elapsed = Date.now() - new Date(lastEvent.time).getTime();
  el.sinceVal.textContent = fmtElapsed(elapsed) + ' nesta estação';
}

    '<span style="font-size:10px; color:var(--muted);">h</span>' +

    '<span style="font-size:10px; color:var(--muted);">m</span></span>';

function appendTotalsRow(label, t, station, extraClass){
  const tr = document.createElement('tr');
  if(extraClass) tr.className = extraClass;
  if(adjustMode && station){
    tr.innerHTML = '<td class="station-cell">' + label + '</td>' +
      '<td>' + durationInputPair('teiji', station, t.teiji) + '</td>' +
      '<td>' + durationInputPair('zangyo', station, t.zangyo) + '</td>' +
      '<td class="total-cell">' + fmtDur(t.teiji + t.zangyo) + '</td>';
  } else {
    tr.innerHTML = '<td class="station-cell">' + label + '</td>' +
      '<td class="teiji-cell">' + fmtDur(t.teiji) + '</td>' +
      '<td class="zangyo-cell">' + fmtDur(t.zangyo) + '</td>' +
      '<td class="total-cell">' + fmtDur(t.teiji + t.zangyo) + '</td>';
  }
  return tr;
}

function renderTotalsTable(totals){
  el.totalsBody.innerHTML = '';
  let grandT = 0, grandZ = 0, anyRow = false;
  STATIONS.forEach(s => {
    const t = totals[s] || {teiji:0, zangyo:0};
    grandT += t.teiji; grandZ += t.zangyo;
    if(t.teiji === 0 && t.zangyo === 0) return; // oculta estações sem horas registradas hoje (também durante o ajuste)
    anyRow = true;
    el.totalsBody.appendChild(appendTotalsRow(labelFor(s), t, s));
  });
  const t3a = totals['3A'] || {teiji:0, zangyo:0};
  const t3b = totals['3B'] || {teiji:0, zangyo:0};
  const combined = { teiji: t3a.teiji + t3b.teiji, zangyo: t3a.zangyo + t3b.zangyo };
  if(!adjustMode && (combined.teiji > 0 || combined.zangyo > 0)){
    el.totalsBody.appendChild(appendTotalsRow(labelFor('3A') + ' + ' + labelFor('3B'), combined, null, 'subtotal'));
  }
  if(!anyRow){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="4" style="text-align:center; color:var(--muted); padding:14px 8px; border-bottom:none;">Nenhuma hora registrada ainda</td>';
    el.totalsBody.appendChild(tr);
    return;
  }
  const grandTr = document.createElement('tr');
  grandTr.className = 'grand';
  grandTr.innerHTML = '<td class="station-cell">Total</td>' +
    '<td class="teiji-cell">' + fmtDur(grandT) + '</td>' +
    '<td class="zangyo-cell">' + fmtDur(grandZ) + '</td>' +
    '<td class="total-cell">' + fmtDur(grandT + grandZ) + '</td>';
  el.totalsBody.appendChild(grandTr);
}

  el.dateLine.textContent = fmtDateHuman(dayData.date);

  const lastEvent = dayData.events[dayData.events.length-1];

  document.querySelectorAll('.station-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.station === activeStation && !dayData.finalized);

  if(dayData.finalized){

    el.finalizedBanner.textContent = 'Serviço finalizado (' + modeLabel + ') às ' + fmtHM(new Date(dayData.finalizedAt)) + '.';

    el.undoBtn.disabled = true;
    el.continueServiceRow.hidden = adjustMode || editStationMode;
  } else {

  renderTotalsTable(getAdjustedTotals());
}

function listDayKeys(){
  const keys = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('day:') && k !== 'day:'+today) keys.push(k);
  }
  return keys.sort().reverse();
}

const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return MONTH_NAMES[m-1] + '/' + y;
}
function prevMonthKey(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-2, 1); // m-1 é o mês atual (0-indexado); -1 de novo pra voltar um mês
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function computeMonthlyTotals(monthKey){
  let teiji = 0, zangyo = 0, hasAny = false;
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith('day:')) continue;
    const dateStr = k.replace('day:','');
    if(!dateStr.startsWith(monthKey)) continue;
    let dd;
    if(dateStr === today){
      dd = dayData; // usa o estado atual em memória, mais atualizado que o último salvo
    } else {
      try{ dd = JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
    }
    if(!dd) continue;
    hasAny = true;
    const t = getTotalsFor(dd);
    STATIONS.forEach(s => { teiji += t[s].teiji; zangyo += t[s].zangyo; });
  }
  return { teiji, zangyo, hasAny };
}
function monthCardHTML(title, monthKey){
  const t = computeMonthlyTotals(monthKey);
  const rate = getHourlyRate();
  if(!t.hasAny){
    return '<div class="month-card"><div class="month-title">' + title + '</div>' +
      '<div style="color:var(--muted); font-size:12px;">Sem registros</div></div>';
  }
  return '<div class="month-card">' +
    '<div class="month-title">' + title + ' — ' + monthLabel(monthKey) + '</div>' +
    '<div class="month-row"><span class="label">Teiji</span><span class="value teiji-value">' + fmtDur(t.teiji) + '</span></div>' +
    '<div class="month-row"><span class="label">Zangyo</span><span class="value zangyo-value">' + fmtDur(t.zangyo) + '</span></div>' +
    '<div class="month-row total"><span class="label">Total</span><span class="value">' + fmtDur(t.teiji + t.zangyo) + '</span></div>' +
    (rate ? '<div class="month-row pay"><span class="label">Estimado</span><span class="value">' + fmtPay(estimatePay(t.teiji, t.zangyo, rate)) + '</span></div>' : '') +
    '</div>';
}
function renderMonthSummary(){
  const currentMonthKey = today.slice(0,7);
  const lastMonthKey = prevMonthKey(currentMonthKey);
  el.monthSummary.innerHTML = '<div class="month-cards">' +
    monthCardHTML('Mês atual (até agora)', currentMonthKey) +
    monthCardHTML('Mês passado', lastMonthKey) +
    '</div>';
}

function loadHistoryList(){
  const keys = listDayKeys();
  if(keys.length === 0){
    el.historyList.innerHTML = '<div class="empty-msg">Nenhum dia anterior registrado ainda.</div>';
    return;
  }
  el.historyList.innerHTML = '';
  keys.forEach(key => {
    const dayKey = key.replace('day:','');
    let dd;
    try{ dd = JSON.parse(localStorage.getItem(key)); }catch(e){ return; }
    if(!dd) return;
    const t = getTotalsFor(dd);
    let grandT = 0, grandZ = 0;
    STATIONS.forEach(s => { grandT += t[s].teiji; grandZ += t[s].zangyo; });
    const item = document.createElement('div');
    item.className = 'history-item';
    item.style.flexDirection = 'column';
    item.style.alignItems = 'stretch';
    const badge = dd.finalized ? '<span class="badge done">finalizado</span>' : '<span class="badge open">em aberto</span>';
    item.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center;">' +
        '<span>' + fmtDateHuman(dayKey) + '</span>' + badge +
      '</div>' +
      '<div style="display:flex; gap:14px; margin-top:6px; font-size:12px; font-family:monospace;">' +
        '<span class="teiji-value" style="color:var(--teiji);">Teiji ' + fmtDur(grandT) + '</span>' +
        '<span class="zangyo-value" style="color:var(--zangyo);">Zangyo ' + fmtDur(grandZ) + '</span>' +
      '</div>';
    item.addEventListener('click', () => showHistoryDetail(dayKey, dd));
    el.historyList.appendChild(item);
  });
}

function buildRealSegmentsHTML(dd){
  let endTime;
  if(dd.finalized) endTime = new Date(dd.finalizedAt);
  else if(dd.date === today) endTime = new Date();
  else endTime = dd.events.length ? new Date(dd.events[dd.events.length-1].time) : null;

  const byStation = {};
  STATIONS.forEach(s => byStation[s] = []);
  for(let i = 0; i < dd.events.length; i++){
    const start = new Date(dd.events[i].time);
    const end = i+1 < dd.events.length ? new Date(dd.events[i+1].time) : endTime;
    if(!end || !(end > start)) continue;
    const st = dd.events[i].station;
    if(!byStation[st]) byStation[st] = [];
    byStation[st].push(start.getHours().toString().padStart(2,'0')+':'+start.getMinutes().toString().padStart(2,'0') + ' – ' +
      end.getHours().toString().padStart(2,'0')+':'+end.getMinutes().toString().padStart(2,'0'));
  }

  let html = '';
  STATIONS.forEach(s => {
    if(byStation[s].length === 0) return;
    html += '<div class="event-row" style="flex-direction:column; align-items:stretch;">' +
      '<div class="ev-station" style="margin-bottom:6px;">' + labelFor(s) + '</div>' +
      byStation[s].map(seg => '<div style="font-family:monospace; font-size:13px; color:var(--text); padding:2px 0;">' + seg + '</div>').join('') +
      '</div>';
  });
  return html || '<div class="empty-msg">Sem registros de horário para este dia.</div>';
}

function showHistoryDetail(dayKey, dd){
  const totals = getTotalsFor(dd);
  el.historyList.innerHTML = '<a class="back-link" id="historyBack">&larr; Voltar ao histórico</a>' +
    '<div class="section-label" style="margin-top:0;">' + fmtDateHuman(dayKey) + (dd.finalized ? ' · finalizado' : ' · em aberto') + '</div>' +
    '<div class="section-label">Horários reais</div>' +
    buildRealSegmentsHTML(dd) +
    '<div class="section-label">Totais (com ajustes)</div>' +
    totalsTableHTML(totals) +
    (dd.finalized ? '<div class="actions"><button class="btn confirm" id="continuePastDayBtn">Continuar este dia (adicionar tempo)</button></div><div id="continuePastDayPanel"></div>' : '');
  document.getElementById('historyBack').addEventListener('click', (e) => { e.preventDefault(); loadHistoryList(); });
  const continueBtn = document.getElementById('continuePastDayBtn');
  if(continueBtn) continueBtn.addEventListener('click', () => openContinuePastDayPanel(dayKey, dd));
}

function openContinuePastDayPanel(dayKey, dd){
  const panel = document.getElementById('continuePastDayPanel');
  let html = '<div class="finalize-panel" style="margin-top:10px;">' +
    '<div style="font-size:14px; margin-bottom:12px;">Reabrir ' + fmtDateHuman(dayKey) + ' e continuar a partir das ' + fmtHM(new Date(dd.finalizedAt)) + ', em qual estação?</div>' +
    '<div class="stations-grid" style="margin-bottom:14px;">';
  STATIONS.forEach(s => { html += '<button class="pick-btn" data-cont-station="' + s + '">' + labelFor(s) + '<small>' + s + '</small></button>'; });
  html += '</div>' +
    '<div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">' +
      '<span style="font-size:13px; color:var(--muted); flex:1;">Quanto tempo a mais?</span>' +
      '<input type="number" id="contHoursInput" min="0" value="0" class="mini-duration-input" style="width:44px; font-size:16px;"><span style="color:var(--muted); font-size:12px;">h</span>' +
      '<input type="number" id="contMinutesInput" min="0" max="59" value="30" class="mini-duration-input" style="width:44px; font-size:16px;"><span style="color:var(--muted); font-size:12px;">min</span>' +
    '</div>' +
    '<div class="actions" style="margin-top:0;"><button class="btn" id="cancelContinuePastBtn">Cancelar</button><button class="btn confirm" id="confirmContinuePastBtn" disabled>Escolha a estação</button></div>' +
    '</div>';
  panel.innerHTML = html;
  let pickedStation = null;
  panel.querySelectorAll('[data-cont-station]').forEach(btn => {
    btn.addEventListener('click', () => {
      pickedStation = btn.dataset.contStation;
      panel.querySelectorAll('[data-cont-station]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('confirmContinuePastBtn').disabled = false;
      document.getElementById('confirmContinuePastBtn').textContent = 'Continuar em ' + labelFor(pickedStation);
    });
  });
  document.getElementById('cancelContinuePastBtn').addEventListener('click', () => { panel.innerHTML = ''; });
  document.getElementById('confirmContinuePastBtn').addEventListener('click', () => {
    if(!pickedStation) return;
    const h = parseInt(document.getElementById('contHoursInput').value, 10) || 0;
    const m = parseInt(document.getElementById('contMinutesInput').value, 10) || 0;
    const addedMs = h*3600000 + m*60000;
    if(addedMs <= 0){ showStatus('Digite uma quantidade de tempo maior que zero.', true); return; }
    applyContinuationToDay(dd, pickedStation, addedMs);
    localStorage.setItem('day:'+dayKey, JSON.stringify(dd));
    logAction('Reabriu o dia ' + dayKey + ' e continuou em ' + labelFor(pickedStation) + ' por mais ' + fmtDur(addedMs));
    showHistoryDetail(dayKey, dd);
    showStatus('Dia continuado — mais ' + fmtDur(addedMs) + ' em ' + labelFor(pickedStation) + '.');
  });
}

function applyContinuationToDay(dd, station, addedMs){
  const zangyoStartMs = timeOnDate(dd.date, ZANGYO_START).getTime();
  let startMs = new Date(dd.finalizedAt).getTime();
  if(dd.finalizeMode !== 'zangyo' && startMs < zangyoStartMs){
    startMs = zangyoStartMs; // se o dia tinha sido fechado só com teiji, pula o intervalo de 10 min antes do zangyo
  }
  dd.events.push({ station, time: new Date(startMs).toISOString() });
  const newEndMs = startMs + addedMs;
  dd.finalizedAt = new Date(newEndMs).toISOString();
  dd.finalizeMode = 'zangyo';
  dd.zangyoHours = parseFloat(Math.max(0, (newEndMs - zangyoStartMs) / 3600000).toFixed(2));
  return dd;
}

el.tabToday.addEventListener('click', () => {
  el.tabToday.classList.add('active');
  el.tabHistory.classList.remove('active');
  el.viewToday.hidden = false;
  el.viewHistory.hidden = true;
});
el.tabHistory.addEventListener('click', () => {
  el.tabHistory.classList.add('active');
  el.tabToday.classList.remove('active');
  el.viewToday.hidden = true;
  el.viewHistory.hidden = false;
  renderMonthSummary();
  loadHistoryList();
});

document.getElementById('generateLogBtn').addEventListener('click', () => {
  const ta = document.getElementById('logTextArea');
  ta.value = generateLogText();
  ta.hidden = false;
  ta.focus();
  ta.select();
  showStatus('Log gerado abaixo — toque nele, selecione tudo e copie pra me mandar.');
});
document.getElementById('versionTag').textContent = APP_VERSION;

function getHourlyRate(){
  try{
    const v = parseFloat(localStorage.getItem(RATE_KEY));
    return (isFinite(v) && v > 0) ? v : null;
  }catch(e){ return null; }
}
function applyRateHidden(hidden){
  el.rateField.hidden = hidden;
  el.rateShowBtn.hidden = !hidden;
}
function loadRateUI(){
  let raw = '', hidden = false;
  try{
    raw = localStorage.getItem(RATE_KEY) || '';
    hidden = localStorage.getItem(RATE_HIDDEN_KEY) === '1';
  }catch(e){ /* sem armazenamento: o campo funciona só nesta sessão */ }
  el.rateInput.value = raw;
  applyRateHidden(hidden);
}
function setRateHidden(hidden){
  try{ localStorage.setItem(RATE_HIDDEN_KEY, hidden ? '1' : '0'); }catch(e){ /* melhor esforço */ }
  applyRateHidden(hidden);
}
el.rateInput.addEventListener('input', () => {
  const v = el.rateInput.value.trim();
  try{
    if(v === '') localStorage.removeItem(RATE_KEY);
    else localStorage.setItem(RATE_KEY, v);
  }catch(e){ /* melhor esforço */ }
  renderMonthSummary();
});
el.rateHideBtn.addEventListener('click', () => setRateHidden(true));
el.rateShowBtn.addEventListener('click', () => setRateHidden(false));

loadRateUI();
loadDay();
</script>
